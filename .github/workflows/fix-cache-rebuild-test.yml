name: One-time cache-rebuild test correction

on:
  push:
    branches:
      - final-faithful-hardening-20261029

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final-faithful-hardening-20261029
      - name: Correct FFmpeg mock semantics
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_transcribe.py')
          text = path.read_text(encoding='utf-8')
          old = '''            probe_failure = subprocess.CalledProcessError(1, ["ffprobe"])
            with patch.object(
                transcribe,
                "probe_audio_duration",
                side_effect=[probe_failure, 12.5],
            ), patch.object(
                transcribe, "measure_peak_db", return_value=None
            ), patch(
                "transcribe.subprocess.run", return_value=SimpleNamespace(returncode=0)
            ):
'''
          new = '''            probe_failure = subprocess.CalledProcessError(1, ["ffprobe"])

            def fake_ffmpeg_run(command, **_kwargs):
                Path(command[-1]).write_bytes(b"rebuilt-wav")
                return SimpleNamespace(returncode=0)

            with patch.object(
                transcribe,
                "probe_audio_duration",
                side_effect=[probe_failure, 12.5],
            ), patch.object(
                transcribe, "measure_peak_db", return_value=None
            ), patch(
                "transcribe.subprocess.run", side_effect=fake_ffmpeg_run
            ):
'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one test block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Self-remove one-time workflow and commit correction
        run: |
          git rm .github/workflows/fix-cache-rebuild-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_transcribe.py
          git commit -m "Correct cache-rebuild test FFmpeg mock"
          git push
